# Project settings cho OMP (symlink: .omp/config.yml).
# Array ở đây THAY THẾ array cùng tên ở ~/.omp/agent/config.yml, không gộp.
textVerbosity: low
defaultThinkingLevel: high
modelRoles:
  advisor: openai-codex/gpt-6-luna:high
  gate: "@advisor"
  plan: anthropic/claude-opus-5-5:high
  slow: "@plan"
lsp:
  # Tắt chờ LSP ở từng thao tác sửa lẻ để tránh cộng dồn độ trễ khi LSP lạnh; chỉ kiểm tra 1 lượt cuối slice.
  diagnosticsOnEdit: false
  formatOnWrite: false
skills:
  # Skill không thuộc phạm vi ERP; vẫn nằm ở .agent/skills cho harness khác.
  ignoredSkills:
    - blog
    - portfolio
    - seo
    - mobile
    - update
# Số đo thực tế 28-30/09: tách tải verifier/researcher khỏi pool chính để chống cạn hạn mức.
compaction:
  # Đo 28/09-03/10: request main trên 200k context chiếm 30% cost; mốc 180k kết hợp tỉa gọn compaction giữ mạch kế hoạch dài qua đêm mà không phình tới 703k.
  thresholdTokens: 180000
advisor:
  # Main (Opus) là nơi chốt; advisor main chiếm ~12.7% cost. Luật cứng máy kiểm được nằm ở boundary-guard (R1-R6); vẫn bật tay được bằng `/advisor on`.
  enabled: false
task:
  # Đợi pre-dispatch gate kiểm brief đầy đủ trước khi worker có thể chạy.
  speculativeLaunch: false
  # Advisor chỉ gác lane viết code; lane read-only không sinh code để bắt lỗi. Map này thắng frontmatter `advisor`.
  agentModelOverrides:
    verifier: "@gate"
    researcher: "@advisor"
    reviewer: "@advisor"
    task: "@task"
    scout: openai-codex/gpt-6-luna:high
    sonic: "@task"
    security-reviewer: "@advisor"
    tech-lead: "@plan"
    backend-specialist: "@task"
    frontend-specialist: "@task"
    test-author: "@task"
    seance: "@task"
  agentAdvisor:
    backend-specialist: "on"
    frontend-specialist: "on"
    test-author: "off"
    task: "off"
    scout: "off"
    sonic: "off"
    researcher: "off"
    reviewer: "off"
    security-reviewer: "off"
    verifier: "off"
  # Ngân sách request theo vai trò (OMP 18.22+ dừng cứng ở 1.5x): kết hợp 3-Beat Tool Batching và chia nhỏ slice <= 2-3 aggregate/worker, vẫn đủ trần cho aggregate lớn (~28 tệp).
  softRequestBudget: 60
  agentSoftRequestBudget:
    backend-specialist: 90
    frontend-specialist: 90
    test-author: 80
    verifier: 60
    reviewer: 60
    security-reviewer: 60
    researcher: 65
    task: 55
    sonic: 45
    scout: 40
  # Mặc định OMP tắt LSP cho subagent; không bật thì worker không có `xd://lsp` và `lsp.diagnosticsOnEdit` ở trên vô tác dụng.
  enableLsp: true
edit:
  # POC: GPT quen `apply_patch`; với hashline, gpt-6-luna lỗi 22% lượt edit. Khớp substring của model id.
  modelVariants:
    "gpt-": apply_patch
retry:
  # Không chờ 10 lần retry với backoff tới 5 phút khi provider/quota không phục hồi; bật chuyển đổi model đa chiều theo cả role lẫn model ID.
  maxRetries: 3
  maxDelayMs: 30000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  fallbackChains:
    # Khi dàn tài khoản Codex chạm usage_limit_reached, tự chuyển sang pool Antigravity / Anthropic thay vì treo 50 phút hoặc chết ở turn 1.
    task:
      - google-antigravity/claude-sonnet-4-6:high
      - anthropic/claude-sonnet-5-5:medium
      - google-antigravity/claude-opus-4-6:high
    advisor:
      - google-antigravity/claude-sonnet-4-6:high
      - anthropic/claude-sonnet-5-5:medium
    gate:
      - google-antigravity/claude-sonnet-4-6:high
      - anthropic/claude-sonnet-5-5:medium
    openai-codex/gpt-6-luna:
      - google-antigravity/claude-sonnet-4-6:high
      - anthropic/claude-sonnet-5-5:medium
      - google-antigravity/claude-opus-4-6:high
    openai-codex/gpt-6.2-sol:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-sonnet-5-5:high
    # Khi Main / Plan (Opus 5.5) hết hạn mức, rơi sang Opus 4.6 ở pool khác trước rồi mới sang Codex / Sonnet.
    plan:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-sonnet-5-5:high
    slow:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-sonnet-5-5:high
    default:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-sonnet-5-5:high
    anthropic/claude-opus-5-5:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-sonnet-5-5:high
      - google-antigravity/gemini-3.8-flash:high
