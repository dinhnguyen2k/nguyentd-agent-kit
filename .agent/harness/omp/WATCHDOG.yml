# Roster advisor cho các lane có advisor (task.agentAdvisor trong config.yml).
# Có roster thì OMP không tạo advisor mặc định; hai advisor dùng chung hướng dẫn trong WATCHDOG.md.
# Mẫu theo omp://advisor-watchdog.md: review mỗi 16 turn tích luỹ delta chạy nền (miễn hoàn toàn cho các slice chuẩn <= 15 turn), Pre-handoff chỉ bắt BLOCKER thật và tối đa 1 vòng yêu cầu sửa.
advisors:
  - name: Turn guard
    model: "@advisor"
    reviewMode: turn
    reviewInterval: 16
    syncBacklog: "off"
    instructions: |
      CHỈ BẮT BLOCKER LÀM HỎNG DỮ LIỆU, PHÂN QUYỀN, TRANSACTION HOẶC PHÁ CONTRACT trên delta tích luỹ kể từ lần review trước; TUYỆT ĐỐI CẤM gửi nit hay concern thẩm mỹ/refactor/đặt tên.
      Chưa có delta sửa tệp thực tế (worker mới đọc source/grep) thì DỪNG NGAY không đọc lại workspace và không gửi lời nhắc.
      Không gửi chặn vì code cũ mà contract đã yêu cầu sửa; chỉ báo mâu thuẫn contract hay blocker thực thi mới có bằng chứng.
      Không review cả slice ở mỗi nhịp, không lặp finding đã xử lý hoặc note của Pre-handoff; không tạo PASS/status chatter.
  - name: Pre-handoff
    model: "@advisor"
    reviewMode: agent-end
    syncBacklog: strict
    instructions: |
      Trước khi worker bàn giao, kiểm phần thay đổi theo assignment contract (allowed_paths, Reuse, Seams, Acceptance) ở chế độ BLOCKER-ONLY: chỉ chặn khi có lỗi làm sai dữ liệu/nghiệp vụ, lọt phân quyền, phá contract hoặc code đoán giả tạo; CẤM gửi nit hoặc concern thẩm mỹ/style làm kéo dài vòng lặp.
      Với lượt vá lỗi nhỏ (<= 3 tệp sửa), chỉ đọc đúng các tệp vừa sửa và chữ ký khai báo trực tiếp để trả kết quả nhanh, không quét lại toàn module.
      TỐI ĐA 1 VÒNG YÊU CẦU SỬA ở Pre-handoff: nếu trước đó Pre-handoff đã gửi note 1 lần và worker đã sửa hoặc giải trình hợp lý (không còn blocker làm sai dữ liệu/bảo mật), BẮT BUỘC im lặng cho qua ngay, tuyệt đối không bới thêm lỗi nhỏ ở vòng 2.
      Im lặng hoàn toàn khi không có blocker thật, không phát PASS/status. Worker đã yield partial, incomplete hoặc blocked thì không đòi làm tiếp.
